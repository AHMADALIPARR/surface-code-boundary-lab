<title>Z408 / Z340 Cipher</title>
<style>
  :root { --bg:#0c0d0f; --paper:#eceae4; --steel:#9aabba; --accent:#c45c26; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:inherit; background:var(--bg); color:var(--paper); }
  header { padding:1rem 1.5rem; border-bottom:1px solid #222; }
  header h1 { margin:0; font-size:1.1rem; letter-spacing:.05em; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section { background:#141516; border:1px solid #222; padding:1rem; }
  label { display:block; font-size:.75rem; color:var(--steel); margin:.5rem 0 .2rem; }
  textarea { width:100%; height:180px; background:#0c0d0f; color:var(--paper); border:1px solid #333; padding:.5rem; font-family:inherit; font-size:.85rem; }
  select, button { background:#1a1b1d; color:var(--paper); border:1px solid #333; padding:.4rem .8rem; font-family:inherit; cursor:pointer; }
  button { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:hover { filter:brightness(1.1); }
  .row { display:flex; gap:.5rem; align-items:center; margin-top:.5rem; }
  .status { font-size:.75rem; color:var(--steel); margin-top:.5rem; }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="index.html">Library</a>
  <a href="circuit.html">Circuit</a>

<header>
  <h1>Z408 / Z340 Cipher — Homophonic + Transposition</h1>
</header>
<main>
  <section>
    <label>Plaintext</label>
    <textarea id="plain" placeholder="Enter plaintext..."></textarea>
    <div class="row">
      <label style="margin:0">Cipher</label>
      <select id="cipher">
        <option value="z408">Z408</option>
        <option value="z340">Z340</option>
      </select>
      <label style="margin:0">Path</label>
      <select id="path">
        <option value="forward">forward</option>
        <option value="reverse">reverse</option>
        <option value="mirror">mirror</option>
        <option value="flip">periodic flip</option>
        <option value="diagonal">diagonal</option>
      </select>
      <button id="enc">Encrypt</button>
    </div>
  </section>
  <section>
    <label>Ciphertext</label>
    <textarea id="cipher_text" placeholder="Ciphertext appears here..."></textarea>
    <div class="row">
      <button id="dec">Decrypt</button>
      <button id="swap">Swap</button>
      <button id="clear">Clear</button>
    </div>
    <div class="status" id="status"></div>
  </section>
</main>
<script>
const HOM = {
  E:["!","@","#"], T:["$","%"], A:["&","*"], O:["(",")"], I:["-","="],
  N:["+","["], S:["]","}"], H:["|",";"], R:[":","<"], D:[">",","],
  L:[".","?"], C:["/","~"], U:["`","^"], M:["_"], W:["\\"], F:['"'],
  G:["'"], Y:["0"], P:["1"], B:["2"], V:["3"], K:["4"], J:["5"],
  X:["6"], Q:["7"], Z:["8"]
};
const REV = {};
for (const [l, syms] of Object.entries(HOM)) syms.forEach(s => REV[s] = l);

function encChar(ch, rng) {
  ch = ch.toUpperCase();
  if (!HOM[ch]) return ch;
  const opts = HOM[ch];
  return opts[Math.floor(rng() * opts.length)];
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function encrypt(text, seed=408) {
  const rng = mulberry32(seed);
  return [...text].map(c => encChar(c, rng)).join("");
}
function decrypt(text) {
  return [...text].map(s => REV[s] || s).join("");
}
function reverse(t) { return [...t].reverse().join(""); }
function mirror(t, w=17) {
  let out = "";
  for (let i = 0; i < t.length; i += w) out += [...t.slice(i, i+w)].reverse().join("");
  return out;
}
function flip(t, w=17, period=9) {
  const rows = [];
  for (let i = 0; i < t.length; i += w) rows.push(t.slice(i, i+w));
  return rows.map((r,i) => ((i+1)%period===0 ? [...r].reverse().join("") : r)).join("");
}
function diagonal(t, w=17) {
  const rows = [];
  for (let i = 0; i < t.length; i += w) rows.push(t.slice(i, i+w).padEnd(w));
  const h = rows.length, res = [];
  for (let s = 0; s < h + w - 1; s++) {
    const d = [];
    for (let r = 0; r < h; r++) { const c = s - r; if (c>=0 && c<w) d.push(rows[r][c]); }
    if (s%2) d.reverse();
    res.push(...d);
  }
  return res.join("").trimEnd();
}

document.getElementById("enc").onclick = () => {
  const plain = document.getElementById("plain").value;
  const path = document.getElementById("path").value;
  const cipher = document.getElementById("cipher").value;
  let ct = encrypt(plain, cipher==="z340"?340:408);
  if (path==="reverse") ct = reverse(ct);
  else if (path==="mirror") ct = mirror(ct);
  else if (path==="flip") ct = flip(ct);
  else if (path==="diagonal") ct = diagonal(ct);
  document.getElementById("cipher_text").value = ct;
  document.getElementById("status").textContent = `Encrypted (${cipher}, ${path})`;
};
document.getElementById("dec").onclick = () => {
  let ct = document.getElementById("cipher_text").value;
  const path = document.getElementById("path").value;
  if (path==="reverse") ct = reverse(ct);
  else if (path==="mirror") ct = mirror(ct);
  else if (path==="flip") ct = flip(ct);
  // diagonal inverse omitted in GUI for brevity; forward path shown
  document.getElementById("plain").value = decrypt(ct);
  document.getElementById("status").textContent = `Decrypted (${path})`;
};
document.getElementById("swap").onclick = () => {
  const a = document.getElementById("plain"), b = document.getElementById("cipher_text");
  [a.value, b.value] = [b.value, a.value];
};
document.getElementById("clear").onclick = () => {
  document.getElementById("plain").value = "";
  document.getElementById("cipher_text").value = "";
  document.getElementById("status").textContent = "";
};
</script>
</body>
</html>
