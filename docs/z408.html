<title>Z408 Cipher</title>
<style>
  :root { --bg:#0c0d0f; --paper:#eceae4; --steel:#9aabba; --accent:#c45c26; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:inherit; background:var(--bg); color:var(--paper); }
  header { padding:1rem 1.5rem; border-bottom:1px solid #222; }
  header h1 { margin:0; font-size:1.1rem; }
  header p { margin:.3rem 0 0; font-size:.75rem; color:var(--steel); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem; max-width:1100px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section { background:#141516; border:1px solid #222; padding:1rem; }
  label { display:block; font-size:.75rem; color:var(--steel); margin:.5rem 0 .2rem; }

<body>

<header>
  <h1>Z408 Cipher</h1>
  <p>Homophonic substitution with reverse, mirror, and section paths</p>
</header>
<main>
  <section>
    <label>Plaintext</label>
    <textarea id="plain" placeholder="Type or paste plaintext..."></textarea>
    <div class="row">
      <label style="margin:0">Path</label>
      <select id="path">
        <option value="forward">forward</option>
        <option value="reverse">reverse</option>
        <option value="mirror">mirror (17-col)</option>
        <option value="sections">section transpose</option>
      </select>
      <label style="margin:0">Seed</label>
      <input id="seed" type="number" value="408" style="width:5rem">
      <button id="enc">Encrypt</button>
    </div>
    <div class="legend">
      Homophones: E→!@# &nbsp; T→$% &nbsp; A→&* &nbsp; O→() &nbsp; I→-= &nbsp; N→+[ &nbsp; …<br>
      Mirror reverses each 17-character row. Sections reverse 8-character blocks.
    </div>
  </section>
  <section>
    <label>Ciphertext</label>
    <textarea id="ct" placeholder="Ciphertext..."></textarea>
    <div class="row">
      <button id="dec">Decrypt</button>
      <button id="swap">Swap</button>
      <button id="clear">Clear</button>
    </div>
    <div class="status" id="status"></div>
  </section>
</main>
<script>
const HOM = {
  E:["!","@","#"], T:["$","%"], A:["&","*"], O:["(",")"], I:["-","="],
  N:["+","["], S:["]","}"], H:["|",";"], R:[":","<"], D:[">",","],
  L:[".","?"], C:["/","~"], U:["`","^"], M:["_"], W:["\\"], F:['"'],
  G:["'"], Y:["0"], P:["1"], B:["2"], V:["3"], K:["4"], J:["5"],
  X:["6"], Q:["7"], Z:["8"]
};
const REV = {};
Object.entries(HOM).forEach(([l,ss]) => ss.forEach(s => REV[s]=l));

function rng(seed) {
  let a = seed|0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0) / 4294967296;
  };
}
function encrypt(text, seed) {
  const r = rng(seed);
  return [...text].map(c => {
    const u = c.toUpperCase();
    if (!HOM[u]) return c;
    const opts = HOM[u];
    return opts[Math.floor(r()*opts.length)];
  }).join("");
}
function decrypt(text) {
  return [...text].map(s => REV[s] || s).join("");
}
function reverse(t) { return [...t].reverse().join(""); }
function mirror(t, w=17) {
  let o = "";
  for (let i=0;i<t.length;i+=w) o += [...t.slice(i,i+w)].reverse().join("");
  return o;
}
function sections(t, n=8) {
  const parts = [];
  for (let i=0;i<t.length;i+=n) parts.push(t.slice(i,i+n));
  return parts.reverse().join("");
}
function applyPath(t, path, invert=false) {
  if (path==="reverse") return reverse(t);
  if (path==="mirror") return mirror(t);
  if (path==="sections") return sections(t);
  return t;
}

document.getElementById("enc").onclick = () => {
  const plain = document.getElementById("plain").value;
  const path = document.getElementById("path").value;
  const seed = parseInt(document.getElementById("seed").value)||408;
  let ct = encrypt(plain, seed);
  ct = applyPath(ct, path);
  document.getElementById("ct").value = ct;
  document.getElementById("status").textContent = `Encrypted · ${path} · seed ${seed} · ${ct.length} symbols`;
};
document.getElementById("dec").onclick = () => {
  let ct = document.getElementById("ct").value;
  const path = document.getElementById("path").value;
  ct = applyPath(ct, path); // involutions
  document.getElementById("plain").value = decrypt(ct);
  document.getElementById("status").textContent = `Decrypted · ${path}`;
};
document.getElementById("swap").onclick = () => {
  const a = document.getElementById("plain"), b = document.getElementById("ct");
  [a.value, b.value] = [b.value, a.value];
};
document.getElementById("clear").onclick = () => {
  document.getElementById("plain").value = "";
  document.getElementById("ct").value = "";
  document.getElementById("status").textContent = "";
};
</script>
</body>
