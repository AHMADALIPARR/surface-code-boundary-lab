name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_surface_code.py
      - run: python src/mlir/run_mlir_backend.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ gcc gfortran
      - run: mkdir -p build
      - run: g++ -O2 -o build/surface_code_cpp src/cpp/surface_code.cpp && ./build/surface_code_cpp
      - run: gcc -O2 -o build/surface_code_c src/c/surface_code.c && ./build/surface_code_c
      - run: gfortran -O2 -o build/surface_code_f90 src/fortran90/surface_code.f90 && ./build/surface_code_f90
