name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html circuit.html quantum_lens.html maze.html z408.html cipher.html _site/
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          mkdir -p _site/visuals/quantum
          cp -r visuals/. _site/visuals/
          cp docs/ATLAS.md _site/ATLAS.md
          cp docs/library.html _site/library.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
