<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTISTIC 2D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#000; --fg:#c8ff9a; --dim:#3a4a32; --amber:#ffb000; --line:#1f1f2e; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--bg); color:var(--fg); }
body {
  font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size:13px; line-height:1.35; letter-spacing:0;
  -webkit-font-smoothing:none; transition:none;
}
a { color:var(--amber); text-decoration:none; }
.site-nav { display:flex; gap:0; border-bottom:1px solid var(--line); background:#000; position:sticky; top:0; z-index:5; }
.site-nav a { color:var(--dim); padding:.45rem .6rem; border-right:1px solid var(--line); }
.site-nav a:hover { color:var(--fg); background:#0a0a0a; }
.shell { display:grid; grid-template-columns:1fr 320px; height:calc(100vh - 32px); }
@media (max-width:700px) { .shell { grid-template-columns:1fr; height:auto; } }
#field { position:relative; overflow:auto; background:#000; min-height:70vh; }
#repl { border-left:1px solid var(--line); padding:.5rem; overflow:auto; }
@media (max-width:700px) { #repl { border-left:none; border-top:1px solid var(--line); } }
#log { white-space:pre-wrap; color:var(--dim); min-height:8rem; }
input, button { font-family:inherit; font-size:13px; background:#000; color:var(--fg); border:1px solid var(--line); padding:.3rem .4rem; border-radius:0; }
button { cursor:pointer; }
button:hover { border-color:var(--amber); color:var(--amber); }
.node {
  position:absolute; border:1px solid var(--line); background:#000; padding:.35rem .45rem;
  min-width:8ch; cursor:pointer; transition:none;
}
.node:hover { border-color:var(--amber); }
.node.focus { border-color:var(--fg); color:var(--fg); }
.node.dim { opacity:.05; }
.slot { color:var(--amber); }
h1 { font-size:13px; font-weight:500; letter-spacing:.15em; padding:.4rem .6rem; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="index.html">Home</a>
  <a href="circuit.html">Circuit</a>
  <a href="quantum_lens.html">Lens</a>
  <a href="maze.html">Maze</a>
  <a href="autistic2d.html">2D</a>

<h1>AUTISTIC 2D · PROTOTYPE HEAP</h1>
<div class="shell">
  <div id="field"></div>
  <div id="repl">
    <div id="log"></div>
    <form id="form">
      <input id="cmd" autocomplete="off" placeholder="clone root  or  set root.mu 3.57" style="width:100%">
    </form>
    <p style="color:var(--dim);margin-top:.6rem">click a node to isolate. no easing. code is the map.</p>
  </div>
</div>
<script>
// Prototype-based Self-like heap. No classes. Objects clone objects.
const heap = {};
let nextId = 1;
function make(proto, slots) {
  const id = "o" + (nextId++);
  const obj = Object.create(proto || null);
  obj._id = id;
  obj._slots = Object.assign({}, slots || {});
  heap[id] = obj;
  return obj;
}
const root = make(null, { kind:"root", mu:3.57, layer:0 });
root._slots.label = "ROOT";
function clone(src, extra) {
  const c = make(src, Object.assign({}, src._slots, extra || {}));
  c._slots.parent = src._id;
  c._slots.label = (extra && extra.label) || (src._slots.label + "'");
  return c;
}
function setSlot(id, key, val) {
  const o = heap[id];
  if (!o) return "missing " + id;
  o._slots[key] = val;
  return id + "." + key + " = " + val;
}
function log(s) { document.getElementById("log").textContent += s + "\n"; }

const field = document.getElementById("field");
let focus = null;
function layout() {
  field.innerHTML = "";
  const ids = Object.keys(heap);
  ids.forEach((id, i) => {
    const o = heap[id];
    const d = document.createElement("div");
    d.className = "node" + (focus===id ? " focus" : focus ? " dim" : "");
    const depth = o._slots.layer || 0;
    d.style.left = (24 + (i % 6) * 140) + "px";
    d.style.top = (24 + Math.floor(i / 6) * 72 + depth * 4) + "px";
    const slots = Object.entries(o._slots).filter(([k]) => k !== "label")
      .map(([k,v]) => `<div class="slot">${k} ${v}</div>`).join("");
    d.innerHTML = `<div>${o._slots.label || id}</div><div style="color:#3a4a32">${id}</div>${slots}`;
    d.onclick = () => { focus = (focus===id ? null : id); layout(); };
    field.appendChild(d);
  });
}
// seed a small lattice
for (let i = 0; i < 4; i++) {
  const c = clone(root, { label:"P"+i, layer:i+1, e:1+i });
  if (i % 2) clone(c, { label:"P"+i+".s", layer:i+2 });
}
layout();
log("heap " + Object.keys(heap).length + " objects");
log("clone <id>   set <id>.<slot> <val>");

document.getElementById("form").onsubmit = (e) => {
  e.preventDefault();
  const raw = document.getElementById("cmd").value.trim();
  document.getElementById("cmd").value = "";
  if (!raw) return;
  const parts = raw.split(/\s+/);
  if (parts[0] === "clone" && parts[1]) {
    const src = heap[parts[1]] || root;
    const c = clone(src, { label: parts[2] || undefined });
    log("cloned " + c._id + " from " + src._id);
  } else if (parts[0] === "set" && parts[1] && parts[2] !== undefined) {
    const [id, key] = parts[1].split(".");
    log(setSlot(id, key, parts.slice(2).join(" ")));
  } else if (parts[0] === "ls") {
    log(Object.keys(heap).join(" "));
  } else {
    log("?");
  }
  layout();
};
</script>
</body>
</html>
