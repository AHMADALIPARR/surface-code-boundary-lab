<rect x="340" y="512" width="520" height="76" fill="#cffafe" class="b"/>
<text x="600" y="542" text-anchor="middle" class="t">PyMatching + NetworkX</text><text x="600" y="566" text-anchor="middle" class="s">Decode • inspect graph • calculate justified paths</text>
<path d="M600 588 V626" class="a"/>
<rect x="260" y="628" width="680" height="80" fill="#fee2e2" class="b"/>
<text x="600" y="659" text-anchor="middle" class="t">Detector-distance visualization + audit report</text><text x="600" y="685" text-anchor="middle" class="s">Graph metric, not automatically physical topology or hardware telemetry</text>
</svg>
